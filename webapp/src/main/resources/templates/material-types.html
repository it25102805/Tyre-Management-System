<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Material Types</title>

    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px;
            color: #2c3e50;
        }

        h1 {
            color: #000000;
            border-bottom: 3px solid #ac0606;
            padding-bottom: 10px;
        }

        .layout {
            display: flex;
            gap: 30px;
            margin-top: 20px;
            align-items: flex-start;
        }

        .table-section {
            flex: 2;
        }

        .form-section {
            flex: 1;
            position: sticky;
            top: 20px;
        }

        #searchBox {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 12px 15px;
            text-align: center;
        }

        th {
            background-color: #8b4545;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f0f3f7;
        }

        /* Action buttons */
        .icon-btn {
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 18px;
            padding: 5px;
            margin: 0 3px;
            width: auto;
        }

        .edit-btn:hover {
            transform: scale(1.2);
        }

        .delete-btn:hover {
            transform: scale(1.2);
        }

        /* Delete form inside table */
        .delete-form {
            display: inline;
            background: none;
            padding: 0;
            margin: 0;
            box-shadow: none;
        }

        /* Main form */
        .material-form {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: 600;
            font-size: 14px;
        }

        select,
        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .error-message {
            color: #ac0606;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }

        button[type="submit"] {
            margin-top: 20px;
            background-color: #ac0606;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }

        button[type="submit"]:hover {
            background-color: #83060f;
        }

        /* Make delete button ignore submit-button styling */
        .delete-form button[type="submit"] {
            margin-top: 0;
            background-color: transparent;
            color: inherit;
            padding: 5px;
            width: auto;
        }

        .delete-form button[type="submit"]:hover {
            background-color: transparent;
        }

    </style>
</head>

<body>

<h1>Material Types</h1>

<div class="layout">

    <!-- TABLE -->
    <div class="table-section">

        <input type="text"
               id="searchBox"
               placeholder="Search by name..."
               onkeyup="filterTable()">

        <table id="materialTable">

            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Unit</th>
                <th>Reorder Level</th>
                <th></th>
            </tr>

            <tr th:each="type : ${materialTypes}">

                <td th:text="${type.materialTypeId}"></td>

                <td th:text="${type.materialName}"></td>

                <td th:text="${type.unit}"></td>

                <td th:text="${type.reorderLevel}"></td>

                <td>

                    <!-- EDIT BUTTON -->
                    <button type="button"
                            class="icon-btn edit-btn"
                            title="Edit"
                            th:attr="onclick='editRow(' + ${type.materialTypeId} + ',&quot;' + ${type.materialName} + '&quot;,&quot;' + ${type.unit} + '&quot;,' + ${type.reorderLevel} + ')'">
                        🖊️
                    </button>


                    <!-- DELETE BUTTON -->
                    <form th:action="@{/material-types/delete/{id}(id=${type.materialTypeId})}"
                          method="post"
                          class="delete-form"
                          onsubmit="return confirm('Are you sure you want to delete this material type?');">

                        <button type="submit"
                                class="icon-btn delete-btn"
                                title="Delete">
                            🗑
                        </button>

                    </form>

                </td>

            </tr>

        </table>

    </div>


    <!-- ADD / EDIT FORM -->
    <div class="form-section">

        <h2 id="formTitle">Add Material Type</h2>

        <form th:action="@{/material-types}"
              th:object="${newMaterialType}"
              method="post"
              class="material-form"
              onsubmit="return validateMaterialName()">

            <input type="hidden"
                   id="materialTypeId"
                   th:field="*{materialTypeId}"/>


            <label>Name</label>

            <input type="text"
                   id="materialName"
                   th:field="*{materialName}"
                   oninput="clearError()"/>

            <div id="nameError" class="error-message">
                This material type already exists.
            </div>


            <label>Unit</label>

            <select id="unit" th:field="*{unit}">
                <option value="kg">kg</option>
                <option value="units">units</option>
                <option value="liters">liters</option>
                <option value="meters">meters</option>
            </select>


            <label>Reorder Level</label>

            <input type="number"
                   id="reorderLevel"
                   th:field="*{reorderLevel}"
                   min="0"/>


            <button type="submit" id="submitBtn">
                Add Material Type
            </button>

        </form>

    </div>

</div>


<script>

    // EDIT MATERIAL TYPE
    function editRow(id, name, unit, reorderLevel) {

        document.getElementById("materialTypeId").value = id;

        document.getElementById("materialName").value = name;

        document.getElementById("unit").value = unit;

        document.getElementById("reorderLevel").value = reorderLevel;

        document.getElementById("formTitle").innerText =
            "Edit Material Type";

        document.getElementById("submitBtn").innerText =
            "Update Material Type";

        clearError();
    }


    // CHECK DUPLICATE MATERIAL NAME
    function validateMaterialName() {

        var input =
            document.getElementById("materialName").value
                .trim()
                .toLowerCase();

        var currentId =
            document.getElementById("materialTypeId").value;

        var rows =
            document.getElementById("materialTable")
                .getElementsByTagName("tr");


        for (var i = 1; i < rows.length; i++) {

            var cells =
                rows[i].getElementsByTagName("td");

            if (cells.length > 0) {

                var existingId =
                    cells[0].textContent.trim();

                var existingName =
                    cells[1].textContent
                        .trim()
                        .toLowerCase();


                if (existingName === input &&
                    existingId !== currentId) {

                    document.getElementById("nameError").style.display =
                        "block";

                    return false;
                }
            }
        }

        return true;
    }


    // CLEAR ERROR MESSAGE
    function clearError() {

        document.getElementById("nameError").style.display =
            "none";
    }


    // SEARCH MATERIAL TYPES
    function filterTable() {

        var input =
            document.getElementById("searchBox")
                .value
                .toUpperCase();

        var rows =
            document.getElementById("materialTable")
                .getElementsByTagName("tr");


        for (var i = 1; i < rows.length; i++) {

            var nameCell =
                rows[i].getElementsByTagName("td")[1];

            if (nameCell) {

                var match =
                    nameCell.textContent
                        .toUpperCase()
                        .indexOf(input) > -1;

                rows[i].style.display =
                    match ? "" : "none";
            }
        }
    }

</script>

</body>
</html>
