<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Material Types | ASI Tyre</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/material-types.css}">
</head>

<body>

<!-- SIDEBAR -->
<aside th:replace="~{fragments/sidebar :: sidebar('types')}"></aside>


<main class="main">

    <!-- PAGE HEADER -->
    <div class="topbar">
        <div class="page-title">
            <h1>Material Types</h1>
            <p>Manage the materials used in tyre rebuilding operations.</p>
        </div>

        <a href="#addMaterialModal" class="add-btn"
           onclick="newMaterial()">
            + Add Material Type
        </a>
    </div>


    <!-- MATERIAL TYPE TABLE -->
    <section class="table-container">

        <div class="table-header">
            <h2>Material Type Records</h2>

            <div class="material-search">
                <input type="text"
                       id="searchBox"
                       placeholder="Search material..."
                       autocomplete="off">
            </div>
        </div>


        <table id="materialTable">

            <thead>
            <tr>
                <th>ID</th>
                <th>Material Name</th>
                <th>Unit</th>
                <th>Reorder Level</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>

            <!-- EMPTY -->
            <tr th:if="${#lists.isEmpty(materialTypes)}">
                <td colspan="5" class="empty">
                    No material types found.
                </td>
            </tr>


            <!-- MATERIAL TYPES -->
            <tr th:each="type : ${materialTypes}">

                <td class="material-id"
                    th:text="'#' + ${type.materialTypeId}">
                    #1
                </td>

                <td class="material-name"
                    th:text="${type.materialName}">
                    Natural Rubber
                </td>

                <td class="material-unit"
                    th:text="${type.unit}">
                    kg
                </td>

                <td class="reorder-level"
                    th:text="${type.reorderLevel != null ? type.reorderLevel : '-'}">
                    100
                </td>

                <!-- ACTIONS -->
                <td>
                    <div class="actions">

                        <!-- EDIT -->
                        <button type="button"
                                class="action-btn"
                                title="Edit"
                                th:attr="
                                    data-id=${type.materialTypeId},
                                    data-name=${type.materialName},
                                    data-unit=${type.unit},
                                    data-reorder=${type.reorderLevel}"
                                onclick="editMaterial(this)">
                            ✏️
                        </button>


                        <!-- DELETE / LOCK -->
                        <div th:if="${usedMaterialTypeIds.contains(type.materialTypeId)}">

                            <button type="button"
                                    class="action-btn locked-btn"
                                    title="Cannot delete. This material type is being used.">
                                🔒
                            </button>

                        </div>

                        <div th:unless="${usedMaterialTypeIds.contains(type.materialTypeId)}">

                            <form th:action="@{/sourcing/material-types/delete/{id}(id=${type.materialTypeId})}"
                                  method="post"
                                  class="delete-form"
                                  onsubmit="return confirm('Are you sure you want to delete this material type?');">

                                <button type="submit"
                                        class="action-btn"
                                        title="Delete">
                                    🗑️
                                </button>

                            </form>

                        </div>

                    </div>
                </td>

            </tr>

            </tbody>
        </table>

    </section>

</main>


<!-- ADD / EDIT MODAL -->
<div class="modal" id="addMaterialModal">

    <div class="modal-content">

        <div class="modal-header">
            <h2 id="formTitle">Add Material Type</h2>

            <a href="#" class="close">×</a>
        </div>


        <form id="materialTypeForm"
              th:action="@{/sourcing/material-types}"
              th:object="${newMaterialType}"
              method="post">

            <input type="hidden"
                   id="materialTypeId"
                   th:field="*{materialTypeId}">


            <!-- MATERIAL NAME -->
            <div class="form-group">

                <label for="materialName">Material Name</label>

                <input type="text"
                       id="materialName"
                       th:field="*{materialName}"
                       placeholder="Enter material name"
                       required>

                <div id="nameError"
                     class="material-error">
                    This material type already exists.
                </div>

            </div>


            <!-- UNIT -->
            <div class="form-group">

                <label for="unit">Unit</label>

                <select id="unit"
                        th:field="*{unit}"
                        required>

                    <option value="">Select unit</option>
                    <option value="kg">kg</option>
                    <option value="units">units</option>
                    <option value="liters">liters</option>
                    <option value="meters">meters</option>

                </select>

            </div>


            <!-- REORDER LEVEL -->
            <div class="form-group">

                <label for="reorderLevel">Reorder Level</label>

                <input type="number"
                       id="reorderLevel"
                       th:field="*{reorderLevel}"
                       min="1"
                       placeholder="Enter reorder level">

            </div>


            <!-- BUTTONS -->
            <div class="modal-footer">

                <a href="#" class="cancel-btn">
                    Cancel
                </a>

                <button type="submit"
                        class="save-btn"
                        id="submitBtn">
                    Add material type
                </button>

            </div>

        </form>

    </div>

</div>


<script>

    /* SEARCH */
    document.getElementById("searchBox").oninput = function () {

        var search = this.value.toLowerCase();

        document.querySelectorAll("#materialTable tbody tr").forEach(function (row) {

            var name = row.cells[1];

            if (name)
                row.style.display =
                    name.textContent.toLowerCase().includes(search) ? "" : "none";

        });
    };


    /* EDIT */
    function editMaterial(button) {

        document.getElementById("materialTypeId").value =
            button.dataset.id;

        document.getElementById("materialName").value =
            button.dataset.name;

        document.getElementById("unit").value =
            button.dataset.unit;

        document.getElementById("reorderLevel").value =
            button.dataset.reorder === "null" ? "" : button.dataset.reorder;

        document.getElementById("formTitle").textContent =
            "Edit material type";

        document.getElementById("submitBtn").textContent =
            "Update material type";

        document.getElementById("nameError").style.display = "none";

        location.hash = "addMaterialModal";
    }


    /* DUPLICATE NAME CHECK */
    document.getElementById("materialTypeForm").onsubmit = function (event) {

        var name = document.getElementById("materialName").value
            .trim().toLowerCase();

        var currentId = document.getElementById("materialTypeId").value;

        var duplicate = false;

        document.querySelectorAll("#materialTable tbody tr").forEach(function (row) {

            if (row.cells.length >= 2 &&
                row.cells[1].textContent.trim().toLowerCase() === name &&
                row.cells[0].textContent.replace("#", "").trim() !== currentId) {

                duplicate = true;
            }
        });

        if (duplicate) {

            event.preventDefault();

            document.getElementById("nameError").style.display = "block";
        }
    };


    /* CLEAR ERROR */
    document.getElementById("materialName").oninput = function () {
        document.getElementById("nameError").style.display = "none";
    };


    /* NEW MATERIAL */
    function newMaterial() {

        document.getElementById("materialTypeForm").reset();

        document.getElementById("materialTypeId").value = "";

        document.getElementById("formTitle").textContent =
            "Add material type";

        document.getElementById("submitBtn").textContent =
            "Add material type";

        document.getElementById("nameError").style.display = "none";
    }

</script>

</body>
</html>
