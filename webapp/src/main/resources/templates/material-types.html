<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Material Types | ASI Tyre</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/material-types.css}">
</head>

<body>

<!-- SIDEBAR -->
<aside th:replace="~{fragments/sidebar :: sidebar('types')}"></aside>


<!-- MAIN CONTENT -->
<main class="main">

    <!-- PAGE HEADER -->
    <div class="topbar">

        <div class="page-title">
            <h1>Material Types</h1>
            <p>Manage the materials used in tyre rebuilding operations.</p>
        </div>

        <a href="#addMaterialModal" class="add-btn">
            + Add Material Type
        </a>

    </div>


    <!-- MATERIAL TYPE TABLE -->
    <section class="table-container">

        <!-- TABLE HEADER -->
        <div class="table-header">

            <h2>Material Type Records</h2>

            <div class="material-search">
                <input
                        type="text"
                        id="searchBox"
                        placeholder="Search material..."
                        autocomplete="off">
            </div>

        </div>


        <!-- TABLE -->
        <table id="materialTable">

            <thead>

            <tr>
                <th>ID</th>
                <th>Material Name</th>
                <th>Unit</th>
                <th>Reorder Level</th>
                <th>Actions</th>
            </tr>

            </thead>


            <tbody>

            <!-- EMPTY -->
            <tr th:if="${#lists.isEmpty(materialTypes)}">

                <td colspan="5" class="empty">
                    No material types found.
                </td>

            </tr>


            <!-- MATERIAL TYPES -->
            <tr th:each="type : ${materialTypes}">

                <!-- ID -->
                <td class="material-id"
                    th:text="'#' + ${type.materialTypeId}">
                    #1
                </td>


                <!-- MATERIAL NAME -->
                <td class="material-name"
                    th:text="${type.materialName}">
                    Natural Rubber
                </td>


                <!-- UNIT -->
                <td class="material-unit"
                    th:text="${type.unit}">
                    kg
                </td>


                <!-- REORDER LEVEL -->
                <td class="reorder-level"
                    th:text="${type.reorderLevel != null ? type.reorderLevel : '-'}">
                    100
                </td>


                <!-- ACTIONS -->
                <td>

                    <div class="actions">

                        <!-- EDIT -->
                        <button
                                type="button"
                                class="action-btn"
                                title="Edit"
                                th:attr="
                                    data-id=${type.materialTypeId},
                                    data-name=${type.materialName},
                                    data-unit=${type.unit},
                                    data-reorder=${type.reorderLevel}"
                                onclick="editMaterial(this)">
                            ✏️
                        </button>


                        <!-- DELETE -->
                        <!-- DELETE / LOCK -->
                        <div th:if="${usedMaterialTypeIds.contains(type.materialTypeId)}">

                            <button
                                    type="button"
                                    class="action-btn locked-btn"
                                    title="Cannot delete. This material type is being used.">
                                🔒
                            </button>

                        </div>


                        <div th:unless="${usedMaterialTypeIds.contains(type.materialTypeId)}">

                            <form
                                    th:action="@{/sourcing/material-types/delete/{id}(id=${type.materialTypeId})}"
                                    method="post"
                                    class="delete-form"
                                    onsubmit="return confirmDelete();">

                                <button
                                        type="submit"
                                        class="action-btn"
                                        title="Delete">
                                    🗑️
                                </button>

                            </form>


                        </div>

                </td>

            </tr>

            </tbody>

        </table>

    </section>

</main>


<!-- =========================================================
     ADD / EDIT MATERIAL TYPE MODAL
     ========================================================= -->

<div class="modal"
     id="addMaterialModal">

    <div class="modal-content">

        <!-- MODAL HEADER -->
        <div class="modal-header">

            <h2 id="formTitle">
                Add Material Type
            </h2>

            <a href="#"
               class="close">
                ×
            </a>

        </div>


        <!-- FORM -->
        <form
                id="materialTypeForm"
                th:action="@{/sourcing/material-types}"
                th:object="${newMaterialType}"
                method="post">


            <!-- HIDDEN ID -->
            <input
                    type="hidden"
                    id="materialTypeId"
                    th:field="*{materialTypeId}">


            <!-- MATERIAL NAME -->
            <div class="form-group">

                <label for="materialName">
                    Material Name
                </label>

                <input
                        type="text"
                        id="materialName"
                        th:field="*{materialName}"
                        placeholder="Enter material name"
                        required>

                <div
                        id="nameError"
                        class="material-error">
                    This material type already exists.
                </div>

            </div>


            <!-- UNIT -->
            <div class="form-group">

                <label for="unit">
                    Unit
                </label>

                <select
                        id="unit"
                        th:field="*{unit}"
                        required>

                    <option value="">
                        Select unit
                    </option>

                    <option value="kg">
                        kg
                    </option>

                    <option value="units">
                        units
                    </option>

                    <option value="liters">
                        liters
                    </option>

                    <option value="meters">
                        meters
                    </option>

                </select>

            </div>


            <!-- REORDER LEVEL -->
            <div class="form-group">

                <label for="reorderLevel">
                    Reorder Level
                </label>

                <input
                        type="number"
                        id="reorderLevel"
                        th:field="*{reorderLevel}"
                        min="0"
                        placeholder="Enter reorder level">

            </div>


            <!-- BUTTONS -->
            <div class="modal-footer">

                <a href="#"
                   class="cancel-btn">
                    Cancel
                </a>

                <button
                        type="submit"
                        class="save-btn"
                        id="submitBtn">
                    Add material type
                </button>

            </div>

        </form>

    </div>

</div>


<!-- =========================================================
     JAVASCRIPT
     ========================================================= -->

<script>

    /* =========================================
       SEARCH MATERIAL TYPES
       ========================================= */

    document.getElementById("searchBox")
        .addEventListener("input", function () {

            var searchText =
                this.value.toLowerCase();

            var rows =
                document
                    .getElementById("materialTable")
                    .getElementsByTagName("tbody")[0]
                    .getElementsByTagName("tr");


            for (var i = 0; i < rows.length; i++) {

                var cells =
                    rows[i].getElementsByTagName("td");


                if (cells.length >= 2) {

                    var materialName =
                        cells[1]
                            .textContent
                            .toLowerCase();


                    if (materialName.includes(searchText)) {

                        rows[i].style.display = "";

                    } else {

                        rows[i].style.display = "none";

                    }

                }

            }

        });


    /* =========================================
       EDIT MATERIAL TYPE
       ========================================= */

    function editMaterial(button) {

        var id =
            button.getAttribute("data-id");

        var name =
            button.getAttribute("data-name");

        var unit =
            button.getAttribute("data-unit");

        var reorder =
            button.getAttribute("data-reorder");


        document.getElementById("materialTypeId")
            .value = id;


        document.getElementById("materialName")
            .value = name;


        document.getElementById("unit")
            .value = unit;


        document.getElementById("reorderLevel")
            .value =
            reorder === "null"
                ? ""
                : reorder;


        document.getElementById("formTitle")
            .textContent = "Edit material type";


        document.getElementById("submitBtn")
            .textContent = "Update material type";


        document.getElementById("nameError")
            .style.display = "none";


        window.location.hash =
            "addMaterialModal";


        document.getElementById("materialName")
            .focus();

    }


    /* =========================================
       DUPLICATE NAME CHECK
       ========================================= */

    document.getElementById("materialTypeForm")
        .addEventListener("submit", function (event) {

            var input =
                document
                    .getElementById("materialName")
                    .value
                    .trim()
                    .toLowerCase();


            var currentId =
                document
                    .getElementById("materialTypeId")
                    .value;


            var rows =
                document
                    .getElementById("materialTable")
                    .getElementsByTagName("tbody")[0]
                    .getElementsByTagName("tr");


            for (var i = 0; i < rows.length; i++) {

                var cells =
                    rows[i].getElementsByTagName("td");


                if (cells.length >= 2) {

                    var existingId =
                        cells[0]
                            .textContent
                            .replace("#", "")
                            .trim();


                    var existingName =
                        cells[1]
                            .textContent
                            .trim()
                            .toLowerCase();


                    if (
                        existingName === input &&
                        existingId !== currentId
                    ) {

                        event.preventDefault();


                        document.getElementById("nameError")
                            .style.display = "block";


                        return;

                    }

                }

            }

        });


    /* =========================================
       CLEAR DUPLICATE ERROR
       ========================================= */

    document.getElementById("materialName")
        .addEventListener("input", function () {

            document.getElementById("nameError")
                .style.display = "none";

        });


    /* =========================================
       DELETE CONFIRMATION
       ========================================= */

    function confirmDelete() {

        return confirm(
            "Are you sure you want to delete this material type?"
        );

    }


    /* =========================================
       RESET FORM WHEN ADD IS CLICKED
       ========================================= */

    document.querySelector(".add-btn")
        .addEventListener("click", function () {

            document.getElementById("materialTypeId")
                .value = "";


            document.getElementById("materialName")
                .value = "";


            document.getElementById("unit")
                .value = "";


            document.getElementById("reorderLevel")
                .value = "";


            document.getElementById("formTitle")
                .textContent = "Add material type";


            document.getElementById("submitBtn")
                .textContent = "Add material type";


            document.getElementById("nameError")
                .style.display = "none";

        });

</script>

</body>
</html>
