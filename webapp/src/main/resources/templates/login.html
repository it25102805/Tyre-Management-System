<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 40px; color: #2c3e50; }
        h1 { color: #000000; border-bottom: 3px solid #ac0606; padding-bottom: 10px; }
        .box { max-width: 420px; margin: 40px auto; }
        form { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        label { display: block; margin-top: 12px; font-weight: 600; font-size: 14px; }
        input { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { margin-top: 20px; background-color: #ac0606; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background-color: #83060f; }
        .error { color: #ac0606; }
        .success { color: #047857; background: #ecfdf5; padding: 10px 12px; border-radius: 6px; font-size: 14px; }

        .forgot-link { text-align: right; margin: 8px 0 0; font-size: 13px; }
        .forgot-link a { color: #ac0606; text-decoration: none; font-weight: 500; }
        .forgot-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="box">
    <h1>Tire Rebuild &amp; Management</h1>
    <p class="error" th:if="${error}" th:text="${error}"></p>
    <p class="success" th:if="${param.reset}">Password updated. Please log in.</p>

    <form th:action="@{/login}" method="post">
        <label>Email</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <div class="forgot-link">
            <a th:href="@{/forgot-password}">Forgot password?</a>
        </div>

        <button type="submit">Login</button>
    </form>

    <p>New here? <a th:href="@{/register}">Register and book a meeting</a></p>
</div>
</body>
</html>
