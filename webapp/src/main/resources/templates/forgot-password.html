<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | ASI Tyre</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<div class="auth-box">
    <a th:href="@{/}" class="logo">ASI <span>Tyre</span></a>

    <h1>Forgot your password?</h1>
    <p class="sub">Enter your registered email and we will send you a link to reset it.</p>

    <div class="alert success" th:if="${message}" th:text="${message}"></div>

    <form th:action="@{/forgot-password}" method="post">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <button type="submit" class="btn-main">Send Reset Link</button>
    </form>

    <p class="back"><a th:href="@{/login}">&larr; Back to login</a></p>
</div>

</body>
</html>
