<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | ASI Tyre</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<div class="auth-box">
    <a th:href="@{/}" class="logo">ASI <span>Tyre</span></a>

    <!-- LINK EXPIRED / INVALID -->
    <th:block th:if="${invalid}">
        <h1>Link expired</h1>
        <div class="alert error">This reset link is invalid or has expired.</div>
        <a th:href="@{/forgot-password}" class="btn-main">Request a new link</a>
    </th:block>

    <!-- NEW PASSWORD FORM -->
    <th:block th:unless="${invalid}">
        <h1>Choose a new password</h1>
        <p class="sub">Your new password must be at least 6 characters.</p>

        <div class="alert error" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/reset-password}" method="post">
            <input type="hidden" name="token" th:value="${token}">

            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" minlength="6" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" minlength="6" required>
            </div>

            <button type="submit" class="btn-main">Reset Password</button>
        </form>
    </th:block>

    <p class="back"><a th:href="@{/login}">&larr; Back to login</a></p>
</div>

</body>
</html>
