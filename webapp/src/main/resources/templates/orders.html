<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders | ASI Tyre</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/purchases.css}">
    <style>
        .modal:target {
            display: flex;
        }
        a.close,
        a.cancel-btn {
            text-decoration: none;
        }
        /* Custom status badge colors for the order pipeline */
        .status.pending { background-color: #fef08a; color: #854d0e; }
        .status.approved { background-color: #bae6fd; color: #0369a1; }
        .status.in_progress { background-color: #e9d5ff; color: #6b21a8; }
        .status.completed { background-color: #bbf7d0; color: #166534; }
        .status.cancelled { background-color: #fecaca; color: #991b1b; }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<!-- SIDEBAR -->
<aside th:replace="~{fragments/sidebar :: sidebar('orders')}"></aside>

<main class="main">

    <!-- HEADER -->
    <div class="topbar">
        <div class="page-title">
            <h1>Tyre Orders</h1>
            <p>Manage and track tyre rebuild client orders.</p>
        </div>

        <!-- BOTH CUSTOMERS AND MANAGERS CAN ADD ORDERS -->
        <a href="#orderModal" class="add-btn" th:text="${session.role == 'CUSTOMER' ? '+ Place Order' : '+ Add Order'}">
            + Place Order
        </a>
    </div>

    <!-- ORDERS TABLE -->
    <section class="table-container">

        <div class="table-header">
            <h2 th:text="${session.role == 'CUSTOMER' ? 'My Order History' : 'All System Orders'}">Records</h2>
        </div>

        <table>
            <thead>
            <tr>
                <th>Order ID</th>
                <!-- ONLY MANAGERS/ADMINS/EMPLOYEES SEE CUSTOMER ID -->
                <th th:if="${session.role != 'CUSTOMER'}">Customer ID</th>
                <th>Tyre Size</th>
                <th>Qty</th>
                <th>Order Date</th>
                <th>Required By</th>
                <th>Status</th>
                <!-- ONLY MANAGERS/ADMINS SEE UPDATE COLUMN -->
                <th th:if="${session.role == 'MANAGER' or session.role == 'ADMIN'}">Update Status</th>
            </tr>
            </thead>

            <tbody>

            <tr th:if="${#lists.isEmpty(orders)}">
                <td th:colspan="${session.role == 'CUSTOMER' ? 6 : 8}" class="empty">
                    No orders found.
                </td>
            </tr>

            <tr th:each="o : ${orders}">
                <td th:text="'#' + ${o.orderId}">#1</td>

                <td th:if="${session.role != 'CUSTOMER'}" th:text="'User ' + ${o.customerId}">User 1</td>

                <td th:text="${o.tyreSize}">195/65R15</td>
                <td th:text="${o.quantity}">4</td>

                <td th:text="${o.orderDate}">2026-10-12</td>
                <td th:text="${o.requiredDate != null ? o.requiredDate : '-'}">2026-10-20</td>

                <!-- STATUS BADGE -->
                <td>
                    <span class="status"
                          th:classappend="${o.orderStatus.name() == 'PENDING' ? 'pending' :
                                          (o.orderStatus.name() == 'APPROVED' ? 'approved' :
                                          (o.orderStatus.name() == 'IN_PROGRESS' ? 'in_progress' :
                                          (o.orderStatus.name() == 'COMPLETED' ? 'completed' : 'cancelled')))}"
                          th:text="${#strings.replace(o.orderStatus.name(), '_', ' ')}">
                    </span>
                </td>

                <!-- STATUS UPDATE FORM (MANAGERS/ADMINS ONLY) -->
                <td th:if="${session.role == 'MANAGER' or session.role == 'ADMIN'}">
                    <form th:action="@{/orders/{id}/status(id=${o.orderId})}" method="post" style="display:flex; gap:6px; justify-content:center;">
                        <select name="status" style="padding: 5px; border-radius: 4px; border: 1px solid #ccc;">
                            <option value="PENDING" th:selected="${o.orderStatus.name() == 'PENDING'}">PENDING</option>
                            <option value="APPROVED" th:selected="${o.orderStatus.name() == 'APPROVED'}">APPROVED</option>
                            <option value="IN_PROGRESS" th:selected="${o.orderStatus.name() == 'IN_PROGRESS'}">IN PROGRESS</option>
                            <option value="COMPLETED" th:selected="${o.orderStatus.name() == 'COMPLETED'}">COMPLETED</option>
                            <option value="CANCELLED" th:selected="${o.orderStatus.name() == 'CANCELLED'}">CANCELLED</option>
                        </select>
                        <button type="submit" class="next-btn" style="padding: 5px 12px;">Save</button>
                    </form>
                </td>

            </tr>
            </tbody>
        </table>

    </section>

</main>

<!-- ADD ORDER MODAL -->
<div class="modal" id="orderModal">
    <div class="modal-content">

        <div class="modal-header">
            <h2 th:text="${session.role == 'CUSTOMER' ? 'Place a New Order' : 'Add New Order'}">Place Order</h2>
            <a href="#" class="close">&times;</a>
        </div>

        <form th:action="@{/orders/create}" method="post">

            <div class="form-group" style="margin-top: 15px;">
                <label for="tyreSize">Tyre Size</label>
                <input type="text"
                       id="tyreSize"
                       name="tyreSize"
                       required
                       placeholder="e.g., 195/65R15">
            </div>

            <div class="form-group" style="margin-top: 15px;">
                <label for="quantity">Quantity</label>
                <input type="number"
                       id="quantity"
                       name="quantity"
                       min="1"
                       required
                       placeholder="Enter number of tyres">
            </div>

            <div class="form-group" style="margin-top: 15px;">
                <label for="requiredDate">Required By Date</label>
                <input type="date"
                       id="requiredDate"
                       name="requiredDate"
                       required>
            </div>

            <div class="modal-footer" style="margin-top: 25px;">
                <a href="#" class="cancel-btn">Cancel</a>
                <button type="submit" class="save-btn">Submit Order</button>
            </div>

        </form>
    </div>
</div>

<script>
    // Set the minimum date for the "Required By" date picker to today
    document.addEventListener('DOMContentLoaded', function() {
        var today = new Date().toISOString().split('T')[0];
        document.getElementById("requiredDate").setAttribute('min', today);
    });
</script>

</body>
</html>
