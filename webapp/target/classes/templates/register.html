<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 40px; color: #2c3e50; }
        h1 { color: #000000; border-bottom: 3px solid #ac0606; padding-bottom: 10px; }
        .box { max-width: 420px; margin: 40px auto; }
        form { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        label { display: block; margin-top: 12px; font-weight: 600; font-size: 14px; }
        input { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { margin-top: 20px; background-color: #ac0606; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background-color: #83060f; }
        .error { color: #ac0606; }
    </style>
</head>
<body>
<div class="box">
    <h1>Register &amp; Book a Meeting</h1>
    <p class="error" th:if="${error}" th:text="${error}"></p>

    <form th:action="@{/register}" method="post">
        <label>Full Name</label>
        <input type="text" name="name" required>

        <label>Email</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <label>Meeting Date</label>
        <input type="date" name="date" required>

        <label>Meeting Time</label>
        <input type="time" name="time" required>

        <label>Purpose</label>
        <input type="text" name="purpose" maxlength="150" required>

        <button type="submit">Register</button>
    </form>

    <p>Already registered? <a th:href="@{/login}">Login</a></p>
</div>
</body>
</html>
